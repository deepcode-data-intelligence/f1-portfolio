[project]
name = "f1-telemetry-lab"
version = "0.1.0"
description = "PI-Vision-style comparative telemetry dashboards on top of the box-box historian"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Manso", email = "rodrigo@deepcode.com.br" }]
requires-python = ">=3.12"
dependencies = [
  "fastf1>=3.4",
  "httpx>=0.27",
  "pandas>=2.2",
  "plotly>=5.24",
  "streamlit>=1.39",
]


[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_telemetry_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
