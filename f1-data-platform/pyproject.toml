[project]
name = "f1-data-platform"
version = "0.1.0"
description = "Layered ETL of the full Formula 1 history (Jolpica-F1 API) into DuckDB + Parquet"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Manso", email = "rodrigo@deepcode.com.br" }]
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "pyarrow>=17",
  "pydantic>=2",
  "pydantic-settings>=2.5",
  "typer>=0.12",
]

[project.scripts]
f1-data = "f1_data_platform.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_data_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
