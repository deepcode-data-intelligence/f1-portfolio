[project]
name = "f1-sim-driver"
version = "0.1.0"
description = "Scripted lap executor: plays an AI-authored lap script (inputs indexed by lap distance) into the F1 game, with a minimal position hold"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Manso", email = "rodrigo@deepcode.com.br" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=2",
  "pydantic>=2",
  "pydantic-settings>=2.5",
  "typer>=0.12",
]

[project.scripts]
f1-driver = "f1_sim_driver.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_sim_driver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
