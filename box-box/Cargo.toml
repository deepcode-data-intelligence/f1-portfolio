[package]
name = "box-box"
version = "0.2.0"
edition = "2021"
description = "A minimal industrial historian (PIMS) for Formula 1 telemetry: tag/time-series model, swinging-door compression, WAL + Parquet storage, HTTP ingest and query API"
license = "MIT"
authors = ["Rodrigo Manso <rodrigo@deepcode.com.br>"]
repository = "https://github.com/deepcode-data-intelligence/f1-portfolio"

[lib]
name = "boxbox"
path = "src/lib.rs"

[[bin]]
name = "box-box"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
axum = { version = "0.7", features = ["query", "json"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
